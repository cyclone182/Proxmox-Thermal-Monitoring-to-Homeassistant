command_line:
  # --- NODE 1 ---
  - sensor:
      name: "Proxmox Node 1 Metrics"
      command: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no root@10.0.30.2 "/usr/local/bin/ha_metrics.sh"'
      scan_interval: 60
      value_template: "OK"
      json_attributes:
        - cpu_temp
        - nvme_temp
        - cpu_freq

  # --- NODE 2 ---
  - sensor:
      name: "Proxmox Node 2 Metrics"
      command: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no root@10.0.30.3 "/usr/local/bin/ha_metrics.sh"'
      scan_interval: 60
      value_template: "OK"
      json_attributes:
        - cpu_temp
        - nvme_temp
        - cpu_freq

  # --- NODE 3 ---
  - sensor:
      name: "Proxmox Node 3 Metrics"
      command: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no root@10.0.30.4 "/usr/local/bin/ha_metrics.sh"'
      scan_interval: 60
      value_template: "OK"
      json_attributes:
        - cpu_temp
        - nvme_temp
        - cpu_freq

template:
  - sensor:
      # Node 1 Sensors
      - name: "Proxmox Node 1 CPU Temp"
        state: "{{ state_attr('sensor.proxmox_node_1_metrics', 'cpu_temp') }}"
        unit_of_measurement: "°F"
      - name: "Proxmox Node 1 NVMe Temp"
        state: "{{ state_attr('sensor.proxmox_node_1_metrics', 'nvme_temp') }}"
        unit_of_measurement: "°F"

      # Node 2 Sensors
      - name: "Proxmox Node 2 CPU Temp"
        state: "{{ state_attr('sensor.proxmox_node_2_metrics', 'cpu_temp') }}"
        unit_of_measurement: "°F"
      - name: "Proxmox Node 2 NVMe Temp"
        state: "{{ state_attr('sensor.proxmox_node_2_metrics', 'nvme_temp') }}"
        unit_of_measurement: "°F"

      # Node 3 Sensors
      - name: "Proxmox Node 3 CPU Temp"
        state: "{{ state_attr('sensor.proxmox_node_3_metrics', 'cpu_temp') }}"
        unit_of_measurement: "°F"
      - name: "Proxmox Node 3 NVMe Temp"
        state: "{{ state_attr('sensor.proxmox_node_3_metrics', 'nvme_temp') }}"
        unit_of_measurement: "°F"
