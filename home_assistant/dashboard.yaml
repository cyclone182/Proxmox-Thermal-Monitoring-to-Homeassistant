type: grid
columns: 1
square: false
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        content: '### 🖥️ Node 1 (NUC8i5)'
      - type: horizontal-stack
        cards:
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.proxmox_node_1_cpu_temp
                    above: -100
                card:
                  type: gauge
                  entity: sensor.proxmox_node_1_cpu_temp
                  name: CPU Temp
                  needle: true
                  min: 60
                  max: 215
                  severity:
                    green: 60
                    yellow: 155
                    red: 185
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.proxmox_node_1_cpu_temp
                    state:
                      - unavailable
                      - unknown
                      - 'null'
                card:
                  type: picture
                  image: >-
                    data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'
                    viewBox='0 0 200 100'%3E%3Crect width='200' height='100'
                    fill='%23D97706'/%3E%3Ctext x='100' y='52'
                    dominant-baseline='middle' text-anchor='middle' fill='white'
                    font-weight='bold' font-family='sans-serif'
                    font-size='24'%3ESENSOR ERROR%3C/text%3E%3C/svg%3E
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.proxmox_node_1_nvme_temp
                    above: -100
                card:
                  type: gauge
                  entity: sensor.proxmox_node_1_nvme_temp
                  name: NVMe Temp
                  needle: true
                  min: 60
                  max: 180
                  severity:
                    green: 60
                    yellow: 115
                    red: 145
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.proxmox_node_1_nvme_temp
                    state:
                      - unavailable
                      - unknown
                      - 'null'
                card:
                  type: picture
                  image: >-
                    data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'
                    viewBox='0 0 200 100'%3E%3Crect width='200' height='100'
                    fill='%23D97706'/%3E%3Ctext x='100' y='52'
                    dominant-baseline='middle' text-anchor='middle' fill='white'
                    font-weight='bold' font-family='sans-serif'
                    font-size='24'%3ESENSOR ERROR%3C/text%3E%3C/svg%3E
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.proxmox_node_1_cpu_temp
            above: -100
        card:
          type: markdown
          content: >
            **Active State:** {{ '🚀 Performance Mode' if
            is_state('sensor.proxmox_node_1_governor', 'performance') else '🔋
            Powersave Mode' }}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.proxmox_node_1_cpu_temp
            state:
              - unavailable
              - unknown
              - 'null'
        card:
          type: picture
          image: >-
            data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'
            viewBox='0 0 400 60'%3E%3Crect width='400' height='60'
            fill='%23D97706'/%3E%3Ctext x='200' y='32'
            dominant-baseline='middle' text-anchor='middle' fill='white'
            font-weight='bold' font-family='sans-serif' font-size='18'%3ENODE
            OFFLINE / UNRESPONSIVE%3C/text%3E%3C/svg%3E
      - type: entities
        title: ⚙️ Governance Controls
        entities:
          - entity: switch.pve1_performance_mode
            name: Manual Override (Performance Mode)
            icon: mdi:cpu-64-bit
          - entity: automation.dc_governance_proxmox_thermal_throttling_node_1
            name: Closed-Loop Automation (Active)
            icon: mdi:robot-outline
