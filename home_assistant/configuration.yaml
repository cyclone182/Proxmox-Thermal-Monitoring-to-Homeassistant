command_line:
  - sensor:
      name: "Proxmox Node 1 CPU Temp"
      command: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_1_IP> "/usr/local/bin/ha_metrics.sh"'
      unit_of_measurement: "°F"
      value_template: "{{ value_json.cpu_temp }}"
      json_attributes:
        - nvme_temp
        - cpu_freq
        - pve_governor
      device_class: temperature
      state_class: measurement
      scan_interval: 60

  - sensor:
      name: "Proxmox Node 2 CPU Temp"
      command: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_2_IP> "/usr/local/bin/ha_metrics.sh"'
      unit_of_measurement: "°F"
      value_template: "{{ value_json.cpu_temp }}"
      json_attributes:
        - nvme_temp
        - cpu_freq
        - pve_governor
      device_class: temperature
      state_class: measurement
      scan_interval: 60

  - sensor:
      name: "Proxmox Node 3 CPU Temp"
      command: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_3_IP> "/usr/local/bin/ha_metrics.sh"'
      unit_of_measurement: "°F"
      value_template: "{{ value_json.cpu_temp }}"
      json_attributes:
        - nvme_temp
        - cpu_freq
        - pve_governor
      device_class: temperature
      state_class: measurement
      scan_interval: 60

shell_command:
  pve_node1_restore: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_1_IP> "/usr/local/bin/thermal_throttle.sh restore"'
  pve_node1_throttle: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_1_IP> "/usr/local/bin/thermal_throttle.sh throttle"'
  pve_node2_restore: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_2_IP> "/usr/local/bin/thermal_throttle.sh restore"'
  pve_node2_throttle: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_2_IP> "/usr/local/bin/thermal_throttle.sh throttle"'
  pve_node3_restore: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_3_IP> "/usr/local/bin/thermal_throttle.sh restore"'
  pve_node3_throttle: 'ssh -i /config/.ssh/proxmox_key -o StrictHostKeyChecking=no -q root@<YOUR_NODE_3_IP> "/usr/local/bin/thermal_throttle.sh throttle"'
